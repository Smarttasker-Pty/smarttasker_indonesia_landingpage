<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account — SmartTasker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #FBFDFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 32px 24px;
        }

        .logo {
            margin-bottom: 24px;
        }

        .logo img {
            height: 40px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #101828;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #667085;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #101828;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D0D5DD;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #DDF770;
            box-shadow: 0 0 0 2px rgba(221, 247, 112, 0.1);
        }

        .checkbox-group {
            display: flex;
            gap: 8px;
            margin: 24px 0;
            padding: 12px;
            background: #FBFDFF;
            border-left: 2px solid #CC2936;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #DDF770;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 13px;
            color: #344054;
            line-height: 1.5;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #DDF770;
            color: #101828;
        }

        .btn-primary:hover:not(:disabled) {
            background: #D0EC4A;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #344054;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        .btn-danger {
            background: #CC2936;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #B8222F;
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            border-top: 3px solid transparent;
        }

        .message.success {
            background: #E8F9F2;
            color: #0B6E4F;
            border-top: 3px solid #58BC82;
            display: block;
        }

        .message.error {
            background: #FCECEC;
            color: #8B1A1A;
            border-top: 3px solid #CC2936;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #DDF770;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="/wp-content/uploads/2024/05/Logo_stacked-yellow2.png" alt="SmartTasker">
            </div>

            <h1>Delete Account</h1>
            <p class="subtitle">Your account and personal data will be permanently removed.</p>

            <div class="message success" id="successMsg"></div>
            <div class="message error" id="errorMsg"></div>

            <form id="deleteForm">
                <!-- Step 1 -->
                <div id="step1">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" onclick="goHome()">Back</button>
                        <button type="button" class="btn-primary" onclick="sendCode()">Send Code</button>
                    </div>
                </div>

                <!-- Step 2 -->
                <div id="step2" class="hidden">
                    <div class="form-group">
                        <label for="code">Verification Code</label>
                        <input type="text" id="code" placeholder="000000" maxlength="6" required>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" onclick="backToStep1()">Back</button>
                        <button type="button" class="btn-primary" onclick="verifyCode()">Verify</button>
                    </div>
                </div>

                <!-- Step 3 -->
                <div id="step3" class="hidden">
                    <div class="checkbox-group">
                        <input type="checkbox" id="confirm" onchange="updateDeleteBtn()">
                        <label for="confirm" class="checkbox-label">I understand this action is permanent and cannot be undone</label>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn-secondary" onclick="backToStep2()">Back</button>
                        <button type="button" class="btn-danger" id="deleteBtn" onclick="deleteAccount()" disabled>Delete Account</button>
                    </div>
                </div>
            </form>

            <div class="back-link">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/v1/delete-account';
        let email = '';
        let token = '';

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            setTimeout(() => el.style.display = 'none', 5000);
        }

        async function sendCode() {
            email = document.getElementById('email').value.trim();
            if (!email) return showError('Enter your email');

            const btn = event.target;
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Error');

                showSuccess('Code sent to your email');
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function verifyCode() {
            const code = document.getElementById('code').value.trim();
            if (code.length !== 6) return showError('Enter 6-digit code');

            const btn = event.target;
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/verify-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Invalid code');

                token = data.token;
                showSuccess('Code verified');
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            } catch (e) {
                showError(e.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteAccount() {
            const btn = event.target;
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Error');

                showSuccess('Account deleted');
                setTimeout(() => window.location.href = '/', 2000);
            } catch (e) {
                showError(e.message);
                btn.disabled = false;
            }
        }

        function backToStep1() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        function backToStep2() {
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function goHome() {
            window.location.href = '/';
        }

        function updateDeleteBtn() {
            document.getElementById('deleteBtn').disabled = !document.getElementById('confirm').checked;
        }
    </script>
</body>
</html>
